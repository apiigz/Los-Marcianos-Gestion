<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administración - Clientes</title>
  <link rel="stylesheet" href="css/usuarios.css">
</head>
<body>
  <header class="admin-header">
    <div class="header-left">
      <span class="close-icon" title="Cerrar panel">&times;</span>
      <h1 class="header-title">Administrador</h1>
    </div>
    <div class="header-right">
      <span id="user-display" class="user-name">Cargando...</span>
      <button id="btn-logout" class="btn-logout" type="button">Cerrar sesión</button>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <nav class="sidebar-nav"></nav>
    </aside>

    <main class="admin-main">
      <section class="content-card">
        <div style="display:flex; gap:.75rem; align-items:center;">
          <input type="text" id="input-buscar" class="table-input" style="max-width:320px;"
                 placeholder="Buscar por razón social, CUIT o teléfono..." autocomplete="off">
          <label style="font-size:.8rem; color:var(--text-muted); cursor:pointer;">
            <input type="checkbox" id="chk-inactivos"> Mostrar inactivos
          </label>
        </div>

        <div class="table-container">
          <table class="users-table">
            <thead>
              <tr>
                <th style="width:5%;">ID</th>
                <th style="width:26%;">Razón social</th>
                <th style="width:14%;">CUIT</th>
                <th style="width:15%;">Condición IVA</th>
                <th style="width:14%;">Teléfono</th>
                <th style="width:14%; text-align:right;">Límite de crédito</th>
                <th style="width:6%; text-align:center;">Activo</th>
                <th style="width:6%; text-align:center;">Acciones</th>
              </tr>
            </thead>
            <tbody id="clientes-tbody"></tbody>
          </table>
        </div>

        <div class="table-footer-actions">
          <button id="btn-add-cliente" class="btn-primary-green" type="button" data-permiso="cliente.gestionar">
            + Agregar Cliente
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- Modal alta / edición -->
  <div id="modal-cliente" class="modal-overlay" hidden>
    <div class="modal-dialog">
      <div class="modal-header">
        <h2 id="modal-cliente-titulo">Nuevo cliente</h2>
        <button type="button" class="btn-modal-close" id="btn-modal-cliente-close">&times;</button>
      </div>
      <form id="form-cliente">
        <div class="modal-body form-grid">
          <div class="form-group full-width">
            <label for="f-razon">Razón social *</label>
            <input type="text" id="f-razon" maxlength="150" required>
          </div>
          <div class="form-group">
            <label for="f-cuit">CUIT</label>
            <input type="text" id="f-cuit" maxlength="13" placeholder="30-12345678-9" inputmode="numeric" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="f-iva">Condición de IVA</label>
            <select id="f-iva">
              <option value="CONSUMIDOR_FINAL">Consumidor final</option>
              <option value="MONOTRIBUTO">Monotributo</option>
              <option value="RESPONSABLE_INSCRIPTO">Responsable inscripto</option>
              <option value="EXENTO">Exento</option>
            </select>
          </div>
          <div class="form-group">
            <label for="f-telefono">Teléfono</label>
            <input type="text" id="f-telefono" maxlength="50">
          </div>
          <div class="form-group">
            <label for="f-limite">Límite de crédito ($)</label>
            <input type="number" id="f-limite" min="0" step="0.01" placeholder="Vacío = sin límite">
            <small class="helper-text">Dejalo vacío para clientes sin tope.</small>
          </div>
          <div class="form-group full-width">
            <label for="f-direccion">Dirección de entrega</label>
            <input type="text" id="f-direccion" maxlength="200">
          </div>
          <div class="form-group full-width">
            <label for="f-obs">Observaciones</label>
            <input type="text" id="f-obs" maxlength="500" placeholder="Ej: paga a los 7 días, horario de recepción...">
          </div>
          <div class="form-group full-width">
            <label style="cursor:pointer; text-transform:none;">
              <input type="checkbox" id="f-activo" checked> Cliente activo
            </label>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-cancel" id="btn-cancel-cliente">Cancelar</button>
          <button type="submit" class="btn-confirm">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>
</body>
</html>
